map $uri $np_master_token_key {
    default "";
    /realms/master/protocol/openid-connect/token $binary_remote_addr;
}
limit_req_zone $np_master_token_key zone=np_master_token_rate:1m rate=5r/s;


map $http_origin $np_suite_origin {
 default "";
 "https://notepreso.com" $http_origin;
 "https://presentation.notepreso.com" $http_origin;
 "https://translation.notepreso.com" $http_origin;
}
map "$host:$upstream_http_content_security_policy" $np_logout_csp {
 default $upstream_http_content_security_policy;
 "~^(?:www\.)?(?:notepreso\.com|presentation\.notepreso\.com|translation\.notepreso\.com):(?<np_suite_prefix>.*connect-src[^;]*)(?<np_suite_suffix>;.*|)$" "$np_suite_prefix https://notepreso.com https://presentation.notepreso.com https://translation.notepreso.com$np_suite_suffix";
}

# P2-4: send browser documents to a branded 404 while preserving API responses.
map "$request_method:$http_accept" $np_audit_document {
    default 0;
    "~*^(GET|HEAD):.*text/html" 1;
    "~^(GET|HEAD):(?:\*/\*)?$" 1;
}
map "$np_audit_document:$uri" $np_audit_notes_document {
    default 0;
    "~^1:/(?:api|static|auth|paddle|health|healthz|ready|readyz|docs|redoc|openapi\.json|\.well-known|_notepreso|metrics)(?:/|$)" 0;
    "~^1:/" 1;
}
map "$np_audit_document:$uri" $np_audit_presentation_missing {
    default 0;
    "~^1:/$" 0;
    "~^1:/(?:app|api|assets|auth|health|healthz|ready|readyz|\.well-known)(?:/|$)" 0;
    "~^1:/(?:lensa-logo\.png|notepreso-presentation-(?:brand|favicon)-v1\.png)$" 0;
    "~^1:/" 1;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 443 ssl;
    server_name notepreso.com www.notepreso.com;
 location = /static/site-chrome.js { alias /var/www/certbot/suite-notes.js; default_type application/javascript; add_header Cache-Control "no-store" always; }
 location = /_notepreso/suite-session {
   if ($np_suite_origin = "") { return 403; }
   if ($request_method = OPTIONS) { return 204; }
   if ($request_method != GET) { return 405; }
   add_header Access-Control-Allow-Origin $np_suite_origin always;
   add_header Access-Control-Allow-Credentials "true" always;
   add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
   add_header Access-Control-Allow-Headers "X-CSRF-Token" always;
   add_header Vary Origin always;
   add_header Cache-Control "no-store" always;
   proxy_hide_header Access-Control-Allow-Origin;
   proxy_hide_header Access-Control-Allow-Credentials;
   proxy_set_header Host notepreso.com;
   proxy_set_header Origin https://notepreso.com;
   proxy_set_header Referer "";
   proxy_set_header X-Forwarded-Proto https;
   proxy_pass http://actia-notepreso-app:8000/api/v1/auth/me;
 }
 location = /_notepreso/suite-logout {
   if ($np_suite_origin = "") { return 403; }
   if ($request_method = OPTIONS) { return 204; }
   if ($request_method != POST) { return 405; }
   add_header Access-Control-Allow-Origin $np_suite_origin always;
   add_header Access-Control-Allow-Credentials "true" always;
   add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
   add_header Access-Control-Allow-Headers "X-CSRF-Token" always;
   add_header Vary Origin always;
   add_header Cache-Control "no-store" always;
   proxy_hide_header Access-Control-Allow-Origin;
   proxy_hide_header Access-Control-Allow-Credentials;
   proxy_set_header Host notepreso.com;
   proxy_set_header Origin https://notepreso.com;
   proxy_set_header Referer "";
   proxy_set_header X-Forwarded-Proto https;
   proxy_pass http://actia-notepreso-app:8000/api/v1/auth/logout;
 }

    location ^~ /api/internal/translation/ { return 404; }

    add_header Strict-Transport-Security "max-age=31536000" always;


    location = /_notepreso/logout-notes {
        if ($http_origin != https://presentation.notepreso.com) { return 403; }
        add_header Access-Control-Allow-Origin "https://presentation.notepreso.com" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "X-CSRF-Token" always;
        add_header Cache-Control "private, no-store" always;
        if ($request_method = OPTIONS) { return 204; }
        if ($request_method != POST) { return 405; }
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_set_header Host $host;
        proxy_set_header Origin https://notepreso.com;
        proxy_set_header Referer "";
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://actia-notepreso-app:8000/api/v1/auth/logout;
    }

    proxy_hide_header Content-Security-Policy;
    add_header Content-Security-Policy $np_logout_csp always;
    ssl_certificate /etc/nginx/certs/notepreso.com.crt;
    ssl_certificate_key /etc/nginx/certs/notepreso.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 55m;

    # NotePreso dedicated Contact Form
    location = /support {

        client_max_body_size 16k;
        proxy_pass http://notepreso-contact-sidecar:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_connect_timeout 5s;
        proxy_read_timeout 35s;
        proxy_send_timeout 35s;
    }

    location / {
        recursive_error_pages on;
        error_page 418 = @np_audit_notes_document;
        if ($np_audit_notes_document) { return 418; }
        proxy_pass http://actia-notepreso-app:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 60s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location @np_audit_notes_document {
        proxy_intercept_errors on;
        error_page 404 =404 /_notepreso/p24-404;
        proxy_pass http://actia-notepreso-app:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 60s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location = /robots.txt {
        proxy_pass http://actia-notepreso-app:8000/static/p24-notes-robots.txt;
    }
    location = /sitemap.xml {
        proxy_pass http://actia-notepreso-app:8000/static/p24-notes-sitemap.xml;
    }
    location = /_notepreso/p24-404 {
        internal;
        proxy_pass http://actia-notepreso-app:8000/static/p24-notes-404.html;
    }


    location = /_notepreso/session-check {
        internal;
        proxy_pass http://actia-notepreso-app:8000/_notepreso/session-check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
    location @notepreso_private_login {
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        return 303 /auth/login?return_to=$uri;
    }
    location = /how-to {

        proxy_pass http://actia-notepreso-app:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
    }
    location = /terms { return 302 /legal#terms; }
    location = /privacy { return 302 /legal#privacy; }

    location = /refund-policy {

        proxy_pass http://actia-notepreso-app:8000/static/refund-policy.html;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
    }

    location = /legal {

        proxy_pass http://actia-notepreso-app:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
    }
}

