server {
    listen 80;
    listen [::]:80;
    server_name aispeakernote.lensalingkungantech.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name aispeakernote.lensalingkungantech.com;

    ssl_certificate /etc/letsencrypt/live/aispeakernote.lensalingkungantech.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aispeakernote.lensalingkungantech.com/privkey.pem;

    client_max_body_size 55m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Public Keycloak OIDC/login endpoints only. Admin remains reachable only through
    # SSH port-forward to 127.0.0.1:8081 on the VPS.
    location ^~ /auth/admin/ { return 404; }
    location ^~ /auth/metrics { return 404; }
    location ^~ /auth/health { return 404; }

    location ^~ /auth/realms/ {
        proxy_pass http://127.0.0.1:8081/auth/realms/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
    }

    location ^~ /auth/resources/ {
        proxy_pass http://127.0.0.1:8081/auth/resources/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        expires 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 30s;
    }
}
