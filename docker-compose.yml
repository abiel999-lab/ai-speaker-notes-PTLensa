services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      APP_ENV: production
      STORAGE_DIR: /app/storage/jobs
      MAX_CONCURRENT_JOBS: "2"
      SLIDE_RENDERER: libreoffice
      LIBREOFFICE_BIN: auto
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-luna}
      OPENAI_REASONING_EFFORT: ${OPENAI_REASONING_EFFORT:-low}
      OPENAI_USE_VISION: ${OPENAI_USE_VISION:-true}
      OPENAI_IMAGE_DETAIL: ${OPENAI_IMAGE_DETAIL:-auto}
      OPENAI_BATCH_SIZE: ${OPENAI_BATCH_SIZE:-4}
      OPENAI_SEMANTIC_RETRIES: ${OPENAI_SEMANTIC_RETRIES:-2}
      OPENAI_RESUME_CHECKPOINTS: ${OPENAI_RESUME_CHECKPOINTS:-true}
      OPENAI_VISION_FALLBACK_TO_TEXT: ${OPENAI_VISION_FALLBACK_TO_TEXT:-true}
      OPENAI_MAX_ESTIMATED_JOB_COST_USD: ${OPENAI_MAX_ESTIMATED_JOB_COST_USD:-1.00}
      OPENAI_VISION_ESTIMATED_INPUT_TOKENS_PER_SLIDE: ${OPENAI_VISION_ESTIMATED_INPUT_TOKENS_PER_SLIDE:-1100}
      OPENAI_INPUT_USD_PER_MTOK: ${OPENAI_INPUT_USD_PER_MTOK:-0.20}
      OPENAI_OUTPUT_USD_PER_MTOK: ${OPENAI_OUTPUT_USD_PER_MTOK:-1.20}
    volumes:
      - speaker_jobs:/app/storage/jobs
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

volumes:
  speaker_jobs:
