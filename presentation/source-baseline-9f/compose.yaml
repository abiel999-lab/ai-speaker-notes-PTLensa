name: verbatim-project2
services:
  database:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: verbatim
      POSTGRES_USER: verbatim
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD:?Run python setup.py first}
    volumes:
      - database:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U verbatim -d verbatim"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [internal]
  redis:
    image: redis:7-bookworm
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [internal]
  app:
    build: .
    image: verbatim-project2:1.0.0-dev.9f.1
    env_file: .env
    environment:
      HOST: 0.0.0.0
      LOCAL_ADMIN_ENABLED: ${LOCAL_ADMIN_ENABLED:-true}
      DATA_DIR: /app/data
      DATABASE_URL: postgresql://verbatim:${APP_DB_PASSWORD}@database:5432/verbatim
      REDIS_URL: redis://redis:6379
    ports:
      - "127.0.0.1:4310:4310"
    volumes:
      - files:/app/data
    depends_on:
      database: {condition: service_healthy}
      redis: {condition: service_healthy}
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 768m
    cpus: 1
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4310/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [internal, egress]
  worker:
    image: verbatim-project2:1.0.0-dev.9f.1
    command: ["node", "server-dist/server/worker.js"]
    env_file: .env
    environment:
      DATA_DIR: /app/data
      DATABASE_URL: postgresql://verbatim:${APP_DB_PASSWORD}@database:5432/verbatim
      REDIS_URL: redis://redis:6379
    volumes:
      - files:/app/data
    depends_on:
      app: {condition: service_healthy}
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1536m
    cpus: 2
    networks: [internal, egress]
volumes:
  database:
  redis:
  files:
networks:
  internal: {internal: true}
  egress:
