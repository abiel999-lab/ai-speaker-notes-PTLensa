services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      POSTGRES_DB: postgres
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/postgres/01-init.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.3
    restart: unless-stopped
    command: ["start", "--import-realm"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HTTP_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: /auth
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME: https://aispeakernote.lensalingkungantech.com/auth
      KC_HOSTNAME_STRICT: "true"
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
    volumes:
      - ./deploy/keycloak/aispeaker-local-realm.json:/opt/keycloak/data/import/aispeaker-realm.json:ro
      - ./deploy/keycloak/themes/lensa-ai:/opt/keycloak/themes/lensa-ai:ro
    ports:
      - "127.0.0.1:8082:8080"
      - "127.0.0.1:9001:9000"
    networks: [backend]

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
    environment:
      APP_NAME: AI Speaker Notes
      APP_ENV: development
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      PUBLIC_BASE_URL: http://localhost:8002
      FRONTEND_ORIGINS: http://localhost:8002
      STORAGE_DIR: /data/jobs
      DATABASE_URL: postgresql+psycopg://ai_speaker_notes:${APP_DB_PASSWORD}@postgres:5432/ai_speaker_notes
      AUTH_ENABLED: "true"
      AUTH_PROVIDER: keycloak
      SESSION_SECRET: ${APP_SESSION_SECRET}
      SESSION_HOURS: "8"
      REQUIRE_TERMS_ACCEPTANCE: "false"
      TERMS_VERSION: "2026-09-14"
      KEYCLOAK_ISSUER: http://localhost:8082/auth/realms/aispeaker
      KEYCLOAK_INTERNAL_ISSUER: http://keycloak:8080/auth/realms/aispeaker
      KEYCLOAK_CLIENT_ID: ai-speaker-notes
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: gpt-5.6-sol
      OPENAI_CHAT_MODEL: gpt-5.6-sol
      OPENAI_REASONING_EFFORT: medium
      OPENAI_CHAT_REASONING_EFFORT: medium
      OPENAI_USE_VISION: "true"
      OPENAI_BATCH_SIZE: "4"
      OPENAI_TIMEOUT_SECONDS: "180"
      OPENAI_MAX_ESTIMATED_JOB_COST_USD: "2.50"
      OPENAI_MAX_SOURCE_CHARS_PER_JOB: "300000"
      CHAT_MAX_MESSAGE_CHARS: "2000"
      CHAT_MAX_TURNS_PER_JOB: "20"
      SLIDE_RENDERER: libreoffice
      RENDER_DPI: "120"
      MAX_UPLOAD_MB: "50"
      JOB_RETENTION_HOURS: "168"
      MAX_CONCURRENT_JOBS: "2"
      MAX_ACTIVE_JOBS_PER_USER: "2"
    volumes:
      - app_data:/data/jobs
    ports:
      - "127.0.0.1:8002:8000"
    networks: [backend]

volumes:
  postgres_data:
  app_data:

networks:
  backend:
    driver: bridge




