[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-speaker-notes-mvp"
version = "1.8.0"
description = "Secure, maintainable MVP for PowerPoint speaker-notes processing."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.128.2",
  "uvicorn[standard]==0.48.0",
  "python-multipart==0.0.29",
  "python-pptx==1.0.2",
  "pydantic==2.13.4",
  "pydantic-settings==2.14.1",
  "jinja2==3.1.6",
  "openai>=3.8,<4",
  "SQLAlchemy>=2.0.43,<3",
  "psycopg[binary]>=3.2.10,<4",
  "httpx>=0.28.1,<1",
  "PyJWT[crypto]>=2.10.1,<3",
  "PyMuPDF>=1.26,<2",
  "pywin32>=312; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = [
  "pytest==9.0.2",
  "httpx==0.28.1",
  "ruff>=0.12,<1.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
